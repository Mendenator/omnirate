[project]
name = "omnirate-backend"
version = "0.1.0"
description = "OmniRate domain API — entities, reviews, PoE, schema registry, search"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "arq>=0.26",
    "jsonschema>=4.23",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28",
    "opensearch-py[async]>=2.8",
    "sentry-sdk[fastapi]>=2.17",
    "python-dateutil>=2.9",
    "boto3>=1.35",
    "pillow>=11.0",
    "imagehash>=4.3",
    "qrcode>=8.0",
    "duckdb>=1.1",
    "lightgbm>=4.5",
    "networkx>=3.4",
    "pgvector>=0.3",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mutmut>=3.2",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "fakeredis>=2.25",
    "piexif>=1.1.3",
    "scikit-learn>=1.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's Depends(...)/Header(...) in default args is the framework's
# own idiom, not the mutable-default-argument bug this rule exists to catch.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
