[project]
name = "omnirate-backend"
version = "0.4.0"
description = "OmniRate domain API — entities, reviews, PoE, schema registry, search"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    # Not pulled transitively by "sqlalchemy>=2.0" alone on every resolver
    # run (only guaranteed via the "sqlalchemy[asyncio]" extra) — but the
    # async engine needs it to import at all, and [tool.coverage.run]'s
    # concurrency = ["greenlet", "thread"] below needs it installed too.
    "greenlet>=3.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "arq>=0.26",
    "jsonschema>=4.23",
    # PyJWT, not python-jose: jose pulls in `ecdsa` (a pure-Python ECC lib
    # with a known, disputed-but-unpatched timing-side-channel issue,
    # PYSEC-2026-1325) transitively even though this app only ever signs
    # HS256 (HMAC) tokens and never touches jose's EC code path. PyJWT
    # supports HS256 with no ecdsa dependency at all — smaller attack
    # surface for identical behavior, not just a suppressed audit finding.
    "PyJWT>=2.9",
    # Used directly by app/core/hospital_qr.py (Ed25519 signing) — previously
    # only ever present transitively via python-jose[cryptography], so
    # removing jose for the PyJWT swap above silently broke this import.
    # Declared explicitly now so it can't happen again from an unrelated change.
    "cryptography>=43",
    "httpx>=0.27",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28",
    "opensearch-py[async]>=2.8",
    "sentry-sdk[fastapi]>=2.17",
    "python-dateutil>=2.9",
    "boto3>=1.35",
    "pillow>=11.0",
    "imagehash>=4.3",
    "qrcode>=8.0",
    "duckdb>=1.1",
    "lightgbm>=4.5",
    "networkx>=3.4",
    "pgvector>=0.3",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mutmut>=3.2",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "fakeredis>=2.25",
    "piexif>=1.1.3",
    "scikit-learn>=1.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's Depends(...)/Header(...) in default args is the framework's
# own idiom, not the mutable-default-argument bug this rule exists to catch.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy's async ORM bridges to sync DBAPI calls via the `greenlet`
# library — without this, coverage.py can't see into code that runs after
# a context switch into one of those greenlets, so any endpoint that awaits
# a db.execute/get/commit reads as "uncovered" past that point even though
# it demonstrably ran (correct status codes, correct branching). Confirmed
# by comparing coverage before/after adding this line against the same
# passing test suite.
concurrency = ["greenlet", "thread"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
