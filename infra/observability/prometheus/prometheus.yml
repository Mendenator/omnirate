global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: omnirate-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
  - job_name: opensearch
    static_configs:
      - targets: ["opensearch-exporter:9114"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
