version: "3.9"

services:
  postgres:
    build: ./infra/postgres
    environment:
      POSTGRES_USER: omnirate
      POSTGRES_PASSWORD: omnirate
      POSTGRES_DB: omnirate
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnirate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    healthcheck:
      # JVM startup + cluster formation genuinely takes 30-60s+ — without
      # this, backend/worker previously started as soon as the *container*
      # started (not once OpenSearch was actually accepting connections) and
      # crashed on their first request. start_period gives it room before
      # failures count against retries.
      test: ["CMD-SHELL", "curl -s -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards
    ports: ["3001:3000"]
    depends_on: [prometheus]

  backend:
    build: ./apps/backend
    env_file: .env
    environment:
      OMNIRATE_DATABASE_URL: postgresql+asyncpg://omnirate:omnirate@postgres:5432/omnirate
      OMNIRATE_REDIS_URL: redis://redis:6379/0
      OMNIRATE_OPENSEARCH_URL: http://opensearch:9200
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      opensearch: { condition: service_healthy }

  worker:
    build: ./apps/backend
    command: ["arq", "app.workers.indexer.WorkerSettings"]
    env_file: .env
    environment:
      OMNIRATE_DATABASE_URL: postgresql+asyncpg://omnirate:omnirate@postgres:5432/omnirate
      OMNIRATE_REDIS_URL: redis://redis:6379/0
      OMNIRATE_OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      opensearch: { condition: service_healthy }

  worker-moderation:
    build: ./apps/backend
    command: ["arq", "app.workers.moderation.WorkerSettings"]
    env_file: .env
    environment:
      OMNIRATE_DATABASE_URL: postgresql+asyncpg://omnirate:omnirate@postgres:5432/omnirate
      OMNIRATE_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
