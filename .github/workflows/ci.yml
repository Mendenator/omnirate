name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Definition of Done (SOW §3.2): CI must complete in ≤10 min.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Nothing in app/ actually uses PostGIS types/functions (lat/lon are
        # plain Numeric columns) — the pgvector extension is what's actually
        # required (domain/models.py's ReviewEmbedding.embedding column), and
        # postgis/postgis doesn't ship it, so Base.metadata.create_all() in
        # tests/conftest.py's `engine` fixture failed on every DB-touching
        # test ("type vector does not exist") the first time CI actually ran
        # end to end. pgvector/pgvector is the extension's own official image.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: omnirate
          POSTGRES_PASSWORD: omnirate
          POSTGRES_DB: omnirate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnirate" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: apps/backend/.python-version
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Check .env.example is in sync with Settings
        run: python scripts/check_env_example.py

      # pg_jsonschema isn't in the stock pgvector/pgvector image used for the
      # CI service container, so the attribute-validation trigger test runs
      # against a schema-less DB here and is covered for real in the
      # docker-compose integration profile (see infra/postgres/Dockerfile).
      - name: Test
        env:
          OMNIRATE_DATABASE_URL: postgresql+asyncpg://omnirate:omnirate@localhost:5432/omnirate
          OMNIRATE_REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      # Needs the CODECOV_TOKEN repo secret (codecov.io -> sign in with
      # GitHub -> add this repo -> copy its upload token) — Codecov has
      # required a token for uploads, public repos included, since 2024.
      # Without the secret this step just fails to upload; it doesn't fail
      # the build (fail_ci_if_error: false) since the badge is informational,
      # not a merge gate.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/backend/coverage.xml
          fail_ci_if_error: false

      - name: Build image
        run: docker build -t omnirate-backend:${{ github.sha }} .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Format check (prettier)
        run: npm run format:check

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # `next build` also re-runs lint + type-check internally, but the
      # explicit steps above give a faster, more specific failure signal.
      - name: Build
        run: npm run build

  # Split from `web` because it needs the live backend stack, not just Node.
  # Runs the backend directly via uvicorn (not the Dockerfile build the
  # `backend` job does at the end) — much faster, and the point here is
  # exercising the app, not the image. Postgres/OpenSearch are the same
  # lightweight service images the `backend` job uses, not the full
  # infra/postgres custom build — the schema is created via
  # Base.metadata.create_all() rather than real Alembic migrations for the
  # same reason (see the "Create database schema" step below); nothing
  # these e2e flows touch needs postgis or pg_jsonschema.
  #
  # The "entity page renders sections in the uniform order" test still
  # skips (no OMNIRATE_E2E_ENTITY_ID) — there's no seed-data step here,
  # only what the "admin can define a new category" flow creates live.
  web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: omnirate
          POSTGRES_PASSWORD: omnirate
          POSTGRES_DB: omnirate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnirate" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      opensearch:
        image: opensearchproject/opensearch:2.17.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -s -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 20 --health-start-period 60s

    env:
      OMNIRATE_DATABASE_URL: postgresql+asyncpg://omnirate:omnirate@localhost:5432/omnirate
      OMNIRATE_REDIS_URL: redis://localhost:6379/0
      OMNIRATE_OPENSEARCH_URL: http://localhost:9200
      OMNIRATE_API_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: apps/backend/.python-version
          cache: pip

      - name: Install backend deps
        working-directory: apps/backend
        run: pip install -e ".[dev]"

      # Not `alembic upgrade head`: migration 0001 unconditionally does
      # CREATE EXTENSION for postgis and pg_jsonschema, neither available on
      # this lightweight service image (and neither actually used by app/ —
      # postgis is unused, pg_jsonschema only backs a DB trigger). Same
      # Base.metadata.create_all() approach the backend job's own tests
      # already use successfully (tests/conftest.py's `engine` fixture).
      - name: Create database schema
        working-directory: apps/backend
        run: python scripts/create_schema_for_e2e.py

      - name: Start backend
        working-directory: apps/backend
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/healthz && exit 0
            sleep 2
          done
          echo "backend never became healthy"; cat /tmp/backend.log; exit 1

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web deps
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Start web
        working-directory: apps/web
        run: |
          nohup npm run start > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000 && exit 0
            sleep 2
          done
          echo "web never became healthy"; cat /tmp/web.log; exit 1

      - name: Run e2e (critical flows + WCAG 2.2 AA scan)
        working-directory: apps/web
        run: npm run e2e

      - name: Upload logs and Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-debug
          path: |
            /tmp/backend.log
            /tmp/web.log
            apps/web/playwright-report/
          retention-days: 7
