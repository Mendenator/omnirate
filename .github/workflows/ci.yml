name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Definition of Done (SOW §3.2): CI must complete in ≤10 min.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: omnirate
          POSTGRES_PASSWORD: omnirate
          POSTGRES_DB: omnirate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U omnirate" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    defaults:
      run:
        working-directory: apps/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: apps/backend/.python-version
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Check .env.example is in sync with Settings
        run: python scripts/check_env_example.py

      # pg_jsonschema isn't in the stock postgis image used for the CI service
      # container, so the attribute-validation trigger test runs against a
      # schema-less DB here and is covered for real in the docker-compose
      # integration profile (see infra/postgres/Dockerfile).
      - name: Test
        env:
          OMNIRATE_DATABASE_URL: postgresql+asyncpg://omnirate:omnirate@localhost:5432/omnirate
          OMNIRATE_REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Build image
        run: docker build -t omnirate-backend:${{ github.sha }} .

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Format check (prettier)
        run: npm run format:check

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # `next build` also re-runs lint + type-check internally, but the
      # explicit steps above give a faster, more specific failure signal.
      - name: Build
        run: npm run build

  # Split from `web` because it needs the live backend stack (custom Postgres
  # image with pg_jsonschema/pgvector, OpenSearch, migrations) rather than
  # just Node — see docs/PROGRESS.md for why the backend job's own Postgres
  # service deliberately uses a lighter stock image instead of that build.
  # Not yet wired up: doing this well needs (a) accepting the custom
  # infra/postgres image's build time inside the 10-minute budget, and
  # (b) a seed-data step for OMNIRATE_E2E_ENTITY_ID (currently that test
  # just skips — see apps/web/e2e/critical-flows.spec.ts). Tracked as
  # follow-up rather than rushed in here.
  web-e2e:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "web e2e CI pending full docker-compose stack + seed data"
