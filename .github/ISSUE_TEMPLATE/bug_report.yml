name: Bug report
description: Something in OmniRate isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If this is a security
        vulnerability, please use the [private security advisory form](https://github.com/Mendenator/omnirate/security/advisories/new)
        instead of a public issue — see [SECURITY.md](../../SECURITY.md).

  - type: dropdown
    id: app
    attributes:
      label: Affected app
      options:
        - backend (apps/backend)
        - web (apps/web)
        - mobile (apps/mobile)
        - infra (docker-compose / infra/)
        - docs
        - other / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error output
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Commit / branch
      description: Which commit or branch were you running?
      placeholder: e.g. master @ abc1234
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS:
        Python/Node version:
        Docker version (if relevant):
    validations:
      required: false
